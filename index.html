    else if(cur.n=="browse"){var b2=q('[data-a="'+(dx>0?"prev":"next")+'"]');if(b2)b2.click()}},{passive:true});
  document.addEventListener("keydown",function(e){var t=e.target,tg=t&&t.tagName;if(tg=="INPUT"||tg=="TEXTAREA"||tg=="SELECT"||e.ctrlKey||e.metaKey||e.altKey)return;
    if(cur.n=="srs"||cur.n=="browse"){
      if(e.key==" "||e.key=="Enter"){var c=q('.card[data-a="flip"]');if(c){e.preventDefault();c.click()}}
      else if(cur.n=="srs"&&cur.flip&&/^[1-4]$/.test(e.key)){var b=q('[data-a="rate"][data-q="'+(e.key-1)+'"]');if(b)b.click()}
      else if(cur.n=="browse"&&e.key=="ArrowLeft"){var n2=q('[data-a="next"]');if(n2)n2.click()}
      else if(cur.n=="browse"&&e.key=="ArrowRight"){var p2=q('[data-a="prev"]');if(p2)p2.click()}}
  });
})();
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a],[data-t],[data-m],[data-go],[data-sp],[data-l]");if(!el)return;
  var d=el.dataset,a=d.a;
  if(d.t){tab=d.t;cur={n:"home"};return render()}
  if(a=="addsave"){AS=$("as").value;var nl=$("a_nl").value.trim(),ar=$("a_ar").value.trim();if(!nl||!ar){cur.am="اكتب الكلمة الهولندية ومعناها بالعربية.";return addTab()}
    var g=function(i){return $(i).value.trim()};var nc=mk([nl,g("a_art"),$("a_ty").value,ar,g("a_en"),g("a_xn"),g("a_xa"),g("a_xe"),""]);nc.pa=g("a_pa");nc.pp=g("a_pp");nc.star=$("a_st").checked?1:0;gs(AS).cards.push(nc);save();cur.am="✓ أُضيفت «"+nl+"» إلى «"+gs(AS).name+"»";toast(cur.am);addTab();$("a_nl").focus();return}
  if(a=="addbulk"){AS=$("as")?$("as").value:AS;var n=parseBulk($("ab").value,gs(AS));save();cur.am="تمت إضافة "+n+" بطاقة إلى «"+gs(AS).name+"»";return addTab()}
  if(a=="sayl")return speakL(d.txt,d.lg||"en-GB");
  if(a=="rw"){Q=d.w;LANG="nl";MODE="auto";R=null;search();return doSearch()}
  if(a=="web"){WEB=!WEB;try{localStorage.setItem("web",WEB?"1":"0")}catch(e){}toast(WEB?"🌐 البحث في قواميس الإنترنت مفعّل":"تم إيقاف البحث في الإنترنت");return search()}
  if(a=="hist"){Q=d.w;LANG=d.lang||"nl";MODE="auto";R=null;search();return doSearch()}
  if(a=="setdg"){setDG(d.s);toast("✓ المجموعة الافتراضية: "+gs(d.s).name);return home()}
  if(a=="sayr")return speak(R.results[+d.i].nl);
  if(a=="addr")return addEntry(R.results[+d.i],el);
  if(a=="full"){Q=R.results[+d.i].nl;MODE="auto";LANG="nl";R=null;search();return doSearch()}
  if(a=="gbench")return gbench();
  if(a=="gsave"){asave();$("gmsg").textContent=" تم الحفظ";toast("✓ تم حفظ الإعدادات");return}
  if(a=="tf"){TF=d.v;return setPage()}
  if(a=="fl"){FL=d.v;return setPage()}
  if(d.m&&!a){var q0=$("sq");if(q0)Q=q0.value;MODE=d.m;R=null;return search()}
  if(d.l&&!a){var q1=$("sq");if(q1)Q=q1.value;LANG=d.l;if(LANG!="nl"&&(MODE=="cj"||MODE=="cmp"))MODE="auto";R=null;return search()}
  if(a=="sw"){var q2=$("sq");if(q2)Q=q2.value;LANG=d.v;if(LANG!="nl"&&(MODE=="cj"||MODE=="cmp"))MODE="auto";R=null;search();return doSearch()}
  if(a=="sug"){Q=R.suggestions[+d.i].w;R=null;search();return doSearch()}
  if(d.go&&!a)return doSearch();
  if(d.sp&&!a)return speak(R.nl);
  if(a=="say")return e.stopPropagation(),speak(SAY);
  if(a=="addw")return addWord();
  if(a=="home"){cur={n:"home"};return render()}
  if(a=="open"){cur={n:"set",set:d.s};return render()}
  if(a=="newset"){var n=$("nsn").value.trim();if(n){var s={id:uid(),name:n,cards:[]};DB.sets.push(s);save();cur={n:"set",set:s.id};render()}return}
  if(a=="io"){cur={n:"io"};return render()}
  if(a=="srsgo")return start("srs",d.s);
  if(a=="go")return start(d.m,cur.set);
  if(a=="dir"){DIR=d.v;return setPage()}
  if(a=="so"){SO=!SO;return setPage()}
  if(a=="flip"){cur.flip=!cur.flip;cur.anim=1;return render()}
  if(a=="star"){e.stopPropagation();var c=cardById(d.c)||cur.q&&cur.q.filter(function(x){return x.id==d.c})[0];if(c){c.star=c.star?0:1;save();render()}return}
  if(a=="rate"){var c=cur.q.shift();rate(c,+d.q);if(+d.q==0)cur.q.push(c);cur.flip=false;cur.d=dirOf();return srs()}
  if(a=="next"){cur.i=Math.min(cur.i+1,cur.q.length);cur.flip=false;cur.res=undefined;if(cur.n=="mc"&&cur.i<cur.q.length)mkq();cur.d=cur.n=="mc"?cur.d:dirOf();if(cur.n=="browse"&&cur.i>=cur.q.length)cur.i=0;return render()}
  if(a=="prev"){cur.i=(cur.i+cur.q.length-1)%cur.q.length;cur.flip=false;return browse()}
  if(a=="pick"&&cur.ans===null){var c=cur.q[cur.i];cur.ans=+d.i;if(cur.opts[cur.ans]===c){cur.s++;rate(c,2)}else rate(c,0);return mc()}
  if(a=="check")return typeCheck();
  if(a=="skip")return typeCheck(true);
  if(a=="tile"){var i=+d.i,t=cur.tiles[i];if(cur.ok[t.k]||cur.bad)return;
    if(cur.sel===null){cur.sel=i}else if(cur.sel==i){cur.sel=null}else{var u=cur.tiles[cur.sel];
      if(u.k==t.k&&u.t!=t.t){cur.ok[t.k]=1;cur.sel=null}else{cur.bad=[cur.sel,i];cur.sel=null;setTimeout(function(){cur.bad=null;if(cur.n=="match")match()},600)}}
    return match()}
  if(a=="savecard"){var s=gs(cur.set);if(!val("f_nl")||!val("f_ar"))return;
    var f={nl:val("f_nl"),art:val("f_art"),ar:val("f_ar"),en:val("f_en"),xn:val("f_xn"),xa:val("f_xa"),xe:val("f_xe"),ty:$("f_ty").value,pa:val("f_pa"),pp:val("f_pp")};
    if(cur.ed){var cc=cardById(cur.ed);Object.assign(cc,f);var ns=gs($("f_gp").value),os=homeSet(cc);if(ns&&os&&ns!==os){os.cards=os.cards.filter(function(x){return x!==cc});ns.cards.push(cc)}cur.ed=null}else s.cards.push(Object.assign(mk([f.nl,f.art,"",f.ar,f.en,f.xn,f.xa,f.xe]),f));
    save();cur.msg=null;return setPage()}
  if(a=="edit"){cur.ed=d.c;setPage();window.scrollTo(0,0);return}
  if(a=="toadd"){AS=cur.set=="__mine"?MAIN().id:cur.set;tab="add";return render()}

  if(a=="bulk"){var s=gs(cur.set),n=0;$("bulk").value.split(/\r?\n/).forEach(function(l){var p=l.split(/[;\t]/).map(function(x){return x.trim()});if(p.length<2||!p[0]||!p[1])return;var m=p[0].match(/^(de|het)\s+(.+)/i);s.cards.push(mk([m?m[2]:p[0],m?m[1].toLowerCase():"","",p[1],p[2]||"","","","",""]));n++});save();cur.msg="تمت إضافة "+n+" بطاقة";return setPage()}
  if(a=="rename"){var n=val("rn");if(n){gs(cur.set).name=n;save()}return setPage()}
  if(a=="delset"){if(cur.ds){DB.sets=DB.sets.filter(function(s){return s.id!=cur.set});save();cur={n:"home"}}else cur.ds=1;return render()}
  if(a=="reset"){if(cur.rs){gs(cur.set).cards.forEach(function(c){c.box=0;c.due=0});save();cur.rs=0;cur.msg="تم تصفير التقدّم"}else cur.rs=1;return setPage()}
  if(a=="restore"){if(!cur.rs){cur.rs=1;return ioPage()}try{var x=JSON.parse($("imp").value);if(!x.sets)throw 0;DB=x;migrate();save();cur={n:"home"};render()}catch(err){cur.rs=0;ioPage();$("iom").textContent="النص غير صالح."}return}
});
render();
</script>
