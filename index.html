}

      x=await qcall(m,p);st=x.r.status;
      if(x.r.ok){if(was404&&m!=first){try{localStorage.setItem("qm",m)}catch(e){}}return qparse(x)}

      if(st==429||st==500||st==503){gnote("النموذج مزدحم الآن، جارٍ إعادة المحاولة…");await sleep(2000*(at+1));continue}
      break;

}
